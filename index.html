<!doctype html>
<html lang="en-PK">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" href="/icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <script>
      (function () {
        var d = document.documentElement;
        if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        d.classList.add("js");
        // first visit in this browser session: play the lock-on intro once
        try {
          if (!sessionStorage.getItem("cx-intro")) {
            sessionStorage.setItem("cx-intro", "1");
            d.classList.add("intro-on");
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* First-visit intro: the logo's crosshair draws, red brackets lock on, the wordmark
         resolves, then the black opens like an iris from the crosshair onto the site. */
      @property --iris { syntax: "<length>"; inherits: false; initial-value: 0px; }
      #intro { display: none; }
      .intro-on #intro {
        position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
        background: #0a0a0a; color: #f2f2f2; pointer-events: none;
        -webkit-mask: radial-gradient(circle at 50% 46%, transparent var(--iris), #000 calc(var(--iris) + 1px));
        mask: radial-gradient(circle at 50% 46%, transparent var(--iris), #000 calc(var(--iris) + 1px));
        animation: intro-iris 0.9s cubic-bezier(0.7, 0, 0.2, 1) 1.75s forwards;
      }
      .intro__lock { position: relative; width: 112px; height: 112px; margin-top: -8vh; }
      .intro__reticle { width: 100%; height: 100%; overflow: visible; fill: none; stroke: currentColor; stroke-width: 2; }
      .intro__ring { stroke-dasharray: 126; stroke-dashoffset: 126; transform: rotate(-90deg); transform-origin: 32px 32px;
        animation: intro-draw 0.8s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards; }
      .intro__tick { stroke-dasharray: 16; stroke-dashoffset: 16; animation: intro-draw 0.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
      .intro__dot { fill: #e1251b; stroke: none; transform: scale(0); transform-origin: 32px 32px;
        animation: intro-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.95s forwards; }
      .intro__ping { fill: none; stroke: #e1251b; stroke-width: 1.5; opacity: 0; transform-origin: 32px 32px;
        animation: intro-ping 0.9s ease-out 1.05s forwards; }
      .intro__brackets { position: absolute; inset: -22px; opacity: 0; transform: scale(1.7);
        --c: #e1251b; --l: 16px; --t: 2px;
        background:
          linear-gradient(var(--c), var(--c)) top left / var(--l) var(--t), linear-gradient(var(--c), var(--c)) top left / var(--t) var(--l),
          linear-gradient(var(--c), var(--c)) top right / var(--l) var(--t), linear-gradient(var(--c), var(--c)) top right / var(--t) var(--l),
          linear-gradient(var(--c), var(--c)) bottom left / var(--l) var(--t), linear-gradient(var(--c), var(--c)) bottom left / var(--t) var(--l),
          linear-gradient(var(--c), var(--c)) bottom right / var(--l) var(--t), linear-gradient(var(--c), var(--c)) bottom right / var(--t) var(--l);
        background-repeat: no-repeat;
        animation: intro-lock 0.55s cubic-bezier(0.34, 1.56, 0.64, 1) 0.8s forwards; }
      .intro__word { position: absolute; left: 50%; top: calc(100% + 44px); width: 180px; max-width: none; transform: translateX(-50%);
        clip-path: inset(0 100% 0 0); animation: intro-word 0.7s cubic-bezier(0.65, 0, 0.35, 1) 1.1s forwards; }
      @keyframes intro-draw { to { stroke-dashoffset: 0; } }
      @keyframes intro-pop { to { transform: scale(1); } }
      @keyframes intro-ping { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(3.2); } }
      @keyframes intro-lock { to { opacity: 1; transform: scale(1); } }
      @keyframes intro-word { to { clip-path: inset(0 0 0 0); } }
      @keyframes intro-iris { to { --iris: 150vmax; } }
    </style>
    <!--app-head-->
  </head>
  <body>
    <div id="intro" aria-hidden="true">
      <div class="intro__lock">
        <svg class="intro__reticle" viewBox="0 0 64 64">
          <circle class="intro__ring" cx="32" cy="32" r="20" />
          <path class="intro__tick" d="M32 2v16" /><path class="intro__tick" d="M32 62V46" />
          <path class="intro__tick" d="M2 32h16" /><path class="intro__tick" d="M62 32H46" />
          <circle class="intro__ping" cx="32" cy="32" r="5" />
          <circle class="intro__dot" cx="32" cy="32" r="5" />
        </svg>
        <span class="intro__brackets"></span>
        <img class="intro__word" src="/images/brand/connexis-logo-white.png" alt="" width="345" height="74" />
      </div>
    </div>
    <script>
      // take the intro out of the page once the iris has opened
      if (document.documentElement.classList.contains("intro-on"))
        setTimeout(function () { var el = document.getElementById("intro"); if (el) el.remove(); document.documentElement.classList.remove("intro-on"); }, 2800);
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
