# Builds and prerenders the site with Vite, then publishes dist/ to GitHub Pages on every push
# to main. In the repo: Settings -> Pages -> Source: "GitHub Actions". Set the VITE_* values
# under Settings -> Secrets and variables -> Actions -> Variables.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Leave BASE_PATH empty once a custom domain points at Pages; until then it is /<repo>/.
          BASE_PATH: ${{ vars.BASE_PATH }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_NOINDEX: ${{ vars.VITE_NOINDEX }}
          VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}
          VITE_LEAD_WEBHOOK_URL: ${{ vars.VITE_LEAD_WEBHOOK_URL }}
          VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
