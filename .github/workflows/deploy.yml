# Builds and prerenders the site with Vite, then publishes dist/ to GitHub Pages on every push
# to main. In the repo: Settings -> Pages -> Source: "GitHub Actions". Set the VITE_* values
# under Settings -> Secrets and variables -> Actions -> Variables.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Two versions share one Pages site:
    #   /     -> the frozen v1 site, built from the `v1` git tag
    #   /v2/  -> the current main branch (noindex, so it doesn't compete with v1 in search)
    env:
      # Defaults to /<repo>/ for github.io. With a custom domain, set the BASE_PATH variable to /.
      ROOT_BASE: ${{ vars.BASE_PATH || format('/{0}/', github.event.repository.name) }}
      VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
      VITE_GTM_ID: ${{ vars.VITE_GTM_ID }}
      VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}
      VITE_LEAD_WEBHOOK_URL: ${{ vars.VITE_LEAD_WEBHOOK_URL }}
      VITE_WHATSAPP: ${{ vars.VITE_WHATSAPP }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1
          path: v1
      - uses: actions/checkout@v4
        with:
          path: v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            v1/package-lock.json
            v2/package-lock.json
      - name: Build v1 (site root)
        working-directory: v1
        env:
          BASE_PATH: ${{ env.ROOT_BASE }}
          VITE_NOINDEX: ${{ vars.VITE_NOINDEX }}
        run: npm ci && npm run build
      - name: Build v2 (/v2/)
        working-directory: v2
        env:
          BASE_PATH: ${{ env.ROOT_BASE }}v2/
          VITE_NOINDEX: "1"
        run: npm ci && npm run build
      - name: Combine
        run: |
          mkdir -p site
          cp -r v1/dist/. site/
          mkdir -p site/v2
          cp -r v2/dist/. site/v2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
